<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>发送到电脑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
  .auto-card {
    background: #f0f7ff;
    border: 1.5px solid #c3d9ff;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: center;
    margin-bottom: 14px;
    transition: background 0.3s, border-color 0.3s;
  }
  .auto-card .icon { font-size: 36px; margin-bottom: 8px; }
  .auto-card .msg { font-size: 14px; color: #2c5fb3; font-weight: 500; line-height: 1.5; }
  .auto-card.success { background: #f1f8e9; border-color: #a5d6a7; }
  .auto-card.success .msg { color: #2e7d32; }
  .url-preview {
    margin-top: 10px; font-size: 11px; color: #666;
    word-break: break-all; background: white;
    border-radius: 6px; padding: 6px 8px;
    text-align: left; max-height: 48px; overflow: hidden;
  }
  textarea {
    width: 100%; height: 90px;
    border: 1.5px solid #e0e0e0; border-radius: 10px;
    padding: 12px; font-size: 14px; color: #333;
    resize: none; outline: none; transition: border-color 0.2s;
  }
  textarea:focus { border-color: #4f8ef7; }
  button {
    width: 100%; margin-top: 10px; padding: 14px;
    background: #4f8ef7; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  button:active { background: #3a7ae0; }
  .hint { margin-top: 8px; font-size: 12px; color: #bbb; text-align: center; }
  .toast {
    display: none; margin-top: 12px; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; text-align: center;
  }
  .toast.ok  { background: #e8f5e9; color: #2e7d32; display: block; }
  .toast.err { background: #fdecea; color: #c62828; display: block; }
  .tip { margin-top: 16px; font-size: 12px; color: #bbb; text-align: center; line-height: 1.6; }
  #manual-toggle { margin-top: 10px; background: #f5f5f5; color: #888; font-size: 13px; padding: 10px; }
</style>
</head>
<body>
<div class="card">
  <h1>📨 发送到电脑</h1>
  <p class="sub">微信复制链接后，点击下方按钮一键发送</p>

  <!-- 主按钮：点击触发剪贴板读取 -->
  <div id="init-area">
    <button id="btn-paste-send">📋 读取剪贴板并发送</button>
    <p class="hint">点击后自动读取链接并发送到电脑</p>
  </div>

  <!-- 成功/处理状态卡片 -->
  <div class="auto-card" id="auto-card" style="display:none">
    <div class="icon" id="auto-icon">🔗</div>
    <div class="msg" id="auto-msg"></div>
    <div class="url-preview" id="url-preview"></div>
  </div>

  <!-- 降级：手动粘贴 -->
  <div id="manual-area" style="display:none">
    <textarea id="url-input" placeholder="粘贴链接到这里..."></textarea>
    <button id="btn-send">发送到电脑 →</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="tip">与电脑在同一 WiFi 下使用，无需登录</div>
</div>
<script src="phone.js"></script>
</body>
</html>
